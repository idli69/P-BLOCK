<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-BLOCK Partner Dashboard</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0e0e0e;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            gap: 20px;
        }
        h1 { color: #4CAF50; letter-spacing: 2px; font-size: 1.8rem; }
        .card {
            background: #1e1e1e;
            border-radius: 16px;
            padding: 28px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        label { font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 6px; }
        input {
            width: 100%;
            padding: 12px 14px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #4CAF50; }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        .btn-connect { background: #4CAF50; color: #000; }
        .btn-unlock { background: #E53935; color: #fff; margin-top: 12px; }
        .btn-lock   { background: #555; color: #fff; margin-top: 8px; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .status-dot {
            display: inline-block; width: 10px; height: 10px;
            border-radius: 50%; margin-right: 8px;
        }
        .dot-online { background: #4CAF50; }
        .dot-offline { background: #E53935; }
        .stat-row { display: flex; justify-content: space-between; margin-top: 12px; }
        .stat { text-align: center; }
        .stat-value { font-size: 2rem; font-weight: 700; }
        .stat-label { font-size: 0.75rem; color: #aaa; margin-top: 2px; }
        .blocked-val { color: #E53935; }
        .hidden { display: none !important; }
        .mono { font-family: monospace; word-break: break-all; font-size: 0.85rem; color: #4CAF50; }
        hr { border-color: #333; margin: 16px 0; }
        p.hint { color: #888; font-size: 0.8rem; line-height: 1.5; margin-top: 8px; }
    </style>
</head>
<body>
    <h1>P-BLOCK</h1>

    <!-- Login Card -->
    <div class="card" id="loginCard">
        <h2 style="margin-bottom:16px">Partner Login</h2>
        <label for="topicInput">Topic ID (from user's app settings)</label>
        <input type="text" id="topicInput" placeholder="e.g. pblock_1234567890" autocomplete="off">
        <button class="btn-connect" onclick="connect()">Connect</button>
        <p class="hint">The person using P-BLOCK can find their Topic ID in the Settings screen or Dashboard.</p>
    </div>

    <!-- Dashboard Card -->
    <div class="card hidden" id="dashCard">
        <h2>Remote Dashboard</h2>
        <hr>
        <div id="heartbeatRow">
            <span class="status-dot dot-offline" id="statusDot"></span>
            <span id="heartbeatText">Connecting...</span>
        </div>
        <p class="hint" id="lastSeenText"></p>
        <div class="stat-row">
            <div class="stat">
                <div class="stat-value" id="totalVal">—</div>
                <div class="stat-label">Total Queries</div>
            </div>
            <div class="stat">
                <div class="stat-value blocked-val" id="blockedVal">—</div>
                <div class="stat-label">Blocked</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="lockStateVal">—</div>
                <div class="stat-label">Status</div>
            </div>
        </div>
        <hr>
        <button class="btn-unlock" onclick="sendCommand('UNLOCK')">UNLOCK DEVICE</button>
        <button class="btn-lock"   onclick="sendCommand('LOCKED')">Re-Lock</button>
        <p class="hint">Topic: <span class="mono" id="topicDisplay"></span></p>
    </div>

    <script type="module">
        import { initializeApp }       from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

        const firebaseConfig = {
            apiKey:      "AIzaSyBF75Q-jfsrhFzaA-uDcB33zpcDhO2FAsk",
            projectId:   "p-block-69",
            databaseURL: "https://p-block-69-default-rtdb.firebaseio.com"
        };
        const app = initializeApp(firebaseConfig);
        const db  = getDatabase(app);

        let currentTopic = null;

        window.connect = function() {
            const raw = document.getElementById('topicInput').value.trim();
            if (!raw) { alert("Please enter a Topic ID"); return; }

            currentTopic = raw;
            document.getElementById('topicDisplay').textContent = raw;
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('dashCard').classList.remove('hidden');

            // Status listener
            onValue(ref(db, `users/${raw}/status`), snap => {
                const s = snap.val() || "LOCKED";
                document.getElementById('lockStateVal').textContent = s === "UNLOCK" ? "Unlocked" : "Locked";
            });

            // Heartbeat listener
            onValue(ref(db, `users/${raw}/last_active`), snap => {
                const ts = snap.val();
                if (!ts) { setOffline("Never seen"); return; }
                const diffMs  = Date.now() - ts;
                const diffMin = Math.round(diffMs / 60000);
                const text    = diffMin < 1 ? "Just now" : `${diffMin} min ago`;
                document.getElementById('lastSeenText').textContent = `Last seen: ${text}`;
                if (diffMs < 20 * 60 * 1000) {
                    setOnline(text);
                } else {
                    setOffline(text);
                }
            });

            // Blocked count listener
            onValue(ref(db, `users/${raw}/blocked_count`), snap => {
                const v = snap.val();
                document.getElementById('blockedVal').textContent = v ?? "—";
            });
        };

        window.sendCommand = async function(cmd) {
            if (!currentTopic) return;
            const confirmed = cmd === "UNLOCK"
                ? confirm("Send UNLOCK command to their device?")
                : confirm("Re-lock the device?");
            if (!confirmed) return;
            await set(ref(db, `users/${currentTopic}/status`), cmd);
            alert(`Command "${cmd}" sent!`);
        };

        function setOnline(text) {
            document.getElementById('statusDot').className = 'status-dot dot-online';
            document.getElementById('heartbeatText').textContent = `Online (${text})`;
        }
        function setOffline(text) {
            document.getElementById('statusDot').className = 'status-dot dot-offline';
            document.getElementById('heartbeatText').textContent = `Offline (${text})`;
        }
    </script>
</body>
</html>
